name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and bundle
        run: npm run verify

      - name: Check committed bundle
        run: git diff --exit-code -- extension.mjs

      - name: Check release packaging
        shell: pwsh
        run: |
          $version = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/package-release.ps1 -Version $version
